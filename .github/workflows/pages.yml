name: Deploy MainAIger website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check website entry point
        run: test -f site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload static website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
