<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="600" viewBox="0 0 1000 600" role="img">
<title>MainAIger Lab — symmetric graph M</title>
<desc>Precisely mirrored geometry with five transparent graph joints, gold diagonal, green start bracket, and red stop bracket. Approved brand baseline v1, 2026-10-26.</desc>
<defs>
 <path id="dark-m-half" d="M330 438V170L500 350" fill="none" stroke-width="104" stroke-linecap="round" stroke-linejoin="round"/>
 <path id="dark-bracket" d="M205 220L105 305L205 390" fill="none" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
 <g id="dark-port"><path d="M330 190L230 158" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="round"/><rect x="205" y="133" width="50" height="50" rx="12" fill="currentColor"/></g>
 <rect id="dark-cutout" x="-17" y="-17" width="34" height="34" rx="9"/>
 <mask id="dark-joint-holes" x="0" y="0" width="1000" height="600" maskUnits="userSpaceOnUse"><g color="white"><use xlink:href="#dark-port"/><use xlink:href="#dark-port" transform="translate(1000 0) scale(-1 1)"/></g><use xlink:href="#dark-m-half" stroke="white"/><use xlink:href="#dark-m-half" stroke="white" transform="translate(1000 0) scale(-1 1)"/>
 <g fill="black"><use xlink:href="#dark-cutout" transform="translate(330 170)"/><use xlink:href="#dark-cutout" transform="translate(330 438)"/><use xlink:href="#dark-cutout" transform="translate(500 350)"/><use xlink:href="#dark-cutout" transform="translate(670 170)"/><use xlink:href="#dark-cutout" transform="translate(670 438)"/></g></mask>
 <clipPath id="dark-gold-limit"><rect x="0" y="0" width="618" height="600"/></clipPath>
 </defs><g aria-label="MainAIger Lab graph M between Start and Stop brackets">
 <use xlink:href="#dark-bracket" stroke="#63C795"/>
 <use xlink:href="#dark-bracket" stroke="#F27E8C" transform="translate(1000 0) scale(-1 1)"/>
 <g mask="url(#dark-joint-holes)">
 <rect width="1000" height="600" fill="#B8A1ED"/>
 <path d="M500 350L670 170" fill="none" stroke="#D9B968" stroke-width="104" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#dark-gold-limit)"/>
 </g></g>
</svg>
