name: Build MainAIger Lab for macOS

# Builds the developer app on GitHub's macOS runners so it can be tested from a
# download instead of a source build. Every push to a feature branch or main
# produces run artifacts (downloadable from the Actions run page by someone
# signed in to GitHub). Pushing a tag such as lab-v0.1.0 additionally publishes
# a public pre-release with the disk images and checksums.
#
# The app is ad-hoc signed only: no Apple Developer ID, no notarization.
# Gatekeeper warns on first launch; docs/RELEASE.md explains the manual steps.
# This workflow does not deploy the website, change DNS or touch any service.

on:
  push:
    branches: ['main', 'feature/**']
    tags: ['lab-v*']
    paths:
      - 'local_lab/**'
      - 'macos/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/release-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple silicon
            arch: arm64
          - runner: macos-15-intel  # Intel; GitHub supports this label until Fall 2027
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Select the Python that will be bundled into the app
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'

      - name: Confirm runner architecture
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          python3 --version
          xcrun swiftc --version | head -1

      - name: Run the Lab tests on macOS
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.js

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/lab-v* ]]; then
            version="${GITHUB_REF#refs/tags/lab-v}"
          else
            version="0.1.0-dev.${GITHUB_SHA:0:7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Build the app bundle
        run: bash macos/build-dev-app.sh

      - name: Ad-hoc sign and package the disk image
        run: bash macos/package-release.sh "${{ steps.version.outputs.version }}"

      - name: Smoke-test the bundled service
        run: |
          # Start the packaged service exactly as the launcher does, confirm it reaches
          # readiness on loopback and serves the panel, then stop it. No Docker here.
          service='build/macos-dev/MainAIger Lab.app/Contents/Resources/mainaiger-lab-service/mainaiger-lab-service'
          state=$(mktemp -d)
          "$service" --port 8794 --state-dir "$state" > service.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            grep -q 'Lab panel: http://127.0.0.1:8794' service.log && break
            sleep 1
          done
          grep -q 'Lab panel: http://127.0.0.1:8794' service.log
          curl -fsS -H 'Host: 127.0.0.1:8794' http://127.0.0.1:8794/ | grep -q 'Unlock your local Lab'
          curl -fsS -H 'Host: 127.0.0.1:8794' http://127.0.0.1:8794/session.js > /dev/null
          test -f "build/macos-dev/MainAIger Lab.app/Contents/Resources/mainaiger-lab-service/_internal/local_lab/kernel/kernel.py"
          kill "$pid"; wait "$pid" || true
          test -f "$state/owner.key"
          rm -rf "$state"

      - name: Upload disk image and checksum
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MainAIger-Lab-${{ steps.version.outputs.version }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish pre-release
    if: startsWith(github.ref, 'refs/tags/lab-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download both architectures
        uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          cat > notes.md <<'EOF'
          Developer preview of MainAIger Lab for macOS.

          **This build is ad-hoc signed and not notarized.** macOS will warn the first
          time you open it. Follow the steps in `docs/RELEASE.md` (right-click → Open,
          or System Settings → Privacy & Security → Open Anyway). Verify the download
          against the `.sha256` file before opening it.

          Docker Desktop is still a separate download; the Lab's setup Mainbook guides
          that step. Real Mac acceptance of the Docker path is tracked in the repository
          checklist; a build appearing here does not by itself prove it.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # The release was drafted in the GitHub web UI; attach the builds to it.
            gh release upload "$TAG" dist/*.dmg dist/*.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/*.dmg dist/*.sha256 \
              --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "MainAIger Lab $TAG (developer preview)" --notes-file notes.md
          fi
